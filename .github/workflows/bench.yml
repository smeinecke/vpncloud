name: Benchmarks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  perf:
    name: Performance regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve base ref
        id: base
        run: echo "ref=${{ github.event.pull_request.base.sha || github.event.before }}" >> "$GITHUB_OUTPUT"
      - name: Bench base commit
        id: bench_base
        run: |
          git worktree add /tmp/base "${{ steps.base.outputs.ref }}"
          cd /tmp/base
          if grep -q 'perf_gate' Cargo.toml 2>/dev/null; then
            PERF_UPDATE=1 PERF_BASELINE=/tmp/base.txt cargo bench --bench perf_gate
          else
            echo "base commit has no perf_gate target - skipping comparison" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare head against base
        if: steps.bench_base.outputs.skip != 'true'
        run: |
          PERF_BASELINE=/tmp/base.txt PERF_TOLERANCE_PCT=30 cargo bench --bench perf_gate
      - name: Run gate against checked-in baseline
        if: steps.bench_base.outputs.skip == 'true'
        continue-on-error: true
        run: cargo bench --bench perf_gate
