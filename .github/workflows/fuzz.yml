name: Fuzzing
on: [push]
jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [init_msg, decrypt, node_info, payload, beacon, range]
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-fuzz
      - name: Generate seed corpus
        run: cargo run --example gen_seeds -- fuzz/corpus/${{ matrix.target }}
      - name: Fuzz
        run: cargo fuzz run ${{ matrix.target }} --manifest-path fuzz/Cargo.toml -- -max_total_time=300 -detect_leaks=0
